# Streamer settings, read by start.sh on the camera (/mnt/sif/owrt/mjpg.conf).
# Edit over telnet, then: /mnt/sif/owrt/start.sh restart
#
# RES: 1280x720 is the sensor's full field of view (640x480 is a centre crop).
#      mjpgd needs ~4 MB for it and leaves ~6 MB free on this 28 MB device.
RES=1280x720
FPS=15
PORT=8080
# Pan/tilt + IR-cut + Wi-Fi control API (hkctl serve)
CTL_PORT=8081
DEVICE=/dev/video0
# Mains frequency for anti-flicker (60 in North America, 50 in Europe/Asia, 0 = off).
# Wrong value = slow dark band rolling through the picture.
PLFREQ=60
# Local time zone as a POSIX TZ string (used for snapshot/recording file names).
# Eastern: EST5EDT,M3.2.0,M11.1.0   Pacific: PST8PDT,M3.2.0,M11.1.0   UTC: UTC0
TZ=EST5EDT,M3.2.0,M11.1.0
# Recordings directory on the SD card (sd.sh mounts the card at /media/sda1).
SAVE_DIR=/media/sda1/plug2view
# HTTP basic auth for everything on PORT (page, video, /api). Set this before
# port-forwarding, e.g. CREDENTIALS=someuser:a-long-unique-passphrase  (no spaces/colons).
# Empty = open on your LAN.
CREDENTIALS=
